spring.application.name=lembrete

# ── Docker Compose (dev local) ────────────────────────────────────────────────
# Aponta para o compose.yaml local (com porta 5432 exposta), evitando que o
# Spring Boot pegue o docker-compose.yml da raiz do projeto (usado em produção)
spring.docker.compose.file=compose.yaml

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lembrete-api}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:DevAdrianoLembrete}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AdrianoVictor159@}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:W4DPHcZqxaipXicbDb49eIzvB3M70XfTtGog0nx3dop}

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200}
