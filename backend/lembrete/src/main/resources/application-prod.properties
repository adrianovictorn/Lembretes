# ── Produção: application-prod.properties ─────────────────────────────────────
# Ativado com: SPRING_PROFILES_ACTIVE=prod

# ── JPA / Hibernante ──────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Connection Pool (HikariCP) ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── Logs ──────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.io.github.adrianovictorn=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Actuator / Segurança ──────────────────────────────────────────────────────
# Desabilita o spring-boot-docker-compose em runtime para não conflitar no container
spring.docker.compose.enabled=false
