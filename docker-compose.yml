# =============================================================================
# Pré-requisito: copie .env.example para .env e preencha os valores
#   cp .env.example .env
#
# Subir tudo:        docker compose up -d --build
# Ver logs:          docker compose logs -f
# Derrubar tudo:     docker compose down
# =============================================================================

name: lembretes

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lembrete_postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # Não falha se .env não existir (crie a partir do .env.example)
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lembrete-api}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lembrete-api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ── Backend (Spring Boot) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/lembrete
      dockerfile: Dockerfile
    container_name: lembrete_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # Não falha se .env não existir (crie a partir do .env.example)
    environment:
      SPRING_PROFILES_ACTIVE:     prod
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lembrete-api}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET:             ${APP_JWT_SECRET}
      APP_CORS_ORIGINS:           ${APP_CORS_ORIGINS}
    ports:
      - "8080:8080"   # Acesso direto à API (debug/testes sem passar pelo Nginx)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s   # Spring Boot pode demorar para inicializar
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # ── Frontend (Angular + Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/lembretes
      dockerfile: Dockerfile
    container_name: lembrete_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lembrete_nginx
    restart: unless-stopped
    ports:
      - "9090:80"     # Porta 9090 isolada para evitar n8n e outras APIs
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Volumes para Certbot (SSL) — descomentar após instalar:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
