services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lembrete_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ── Backend (Spring Boot) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/lembrete
      dockerfile: Dockerfile
    container_name: lembrete_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE:    prod
      SPRING_DATASOURCE_URL:     jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET:            ${APP_JWT_SECRET}
      APP_CORS_ORIGINS:          ${APP_CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # ── Frontend (Angular + Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/lembretes
      dockerfile: Dockerfile
    container_name: lembrete_frontend
    restart: unless-stopped
    networks:
      - app_network

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lembrete_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Volumes para Certbot (SSL) — descomentar após instalar:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
