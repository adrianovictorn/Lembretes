<div class="bg-slate-800 max-w-md mx-auto rounded-lg text-white p-15">
    <form [formGroup]="form" (ngSubmit)="logar()" class="flex flex-col gap-5">
        <div class="flex flex-col p-2  ">
            <label for="usuario" class="text-xl font-semibold ">Usuário</label>
            <input type="text" id="usuario" class="border border-neutral-600 rounded-lg p-2" formControlName="username">
        </div>

        <div class="flex flex-col p-2">
            <label for="senha" class="text-xl font-semibold">Senha</label>
            <input type="password" id="senha" class="border border-neutral-600 rounded-lg p-2" formControlName="password">
        </div>

        <div class="flex flex-col" >
            <button type="submit" class="text-white bg-sky-700 hover:bg-sky-600 p-3 rounded-lg mt-3">Login</button>
        </div>
    </form>

    <div class="mt-5">
        <a href="/cadastrar" class="text-sky-500 hover:text-sky-400">Não tem uma conta? Cadastre-se</a>
    </div>
</div>
